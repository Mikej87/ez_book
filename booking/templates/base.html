{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ Book | Restaurant Reservations</title>
    
    <!-- FIXED BOOTSTRAP CSS LINK -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <!-- Brand -->
            <a class="navbar-brand" href="{% url 'home' %}">EZ Book</a>

            <!-- Centered Links -->
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                    <a class="nav-link" href="{% url 'menu' %}">Menu</a>
                    
                        <a class="nav-link" href="{% url 'my_bookings' %}">My Bookings</a>
                        <a class="nav-link" href="{% url 'booking_create' %}">New Reservation</a>
        
                 </div>
            </div>

            <!-- Empty spacer to balance the Brand logo on the left -->
            <div style="width: 80px;" class="d-none d-lg-block"></div>
        </div>  
    </nav>

    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>

    <!-- FIXED BOOTSTRAP JS LINK -->
    <script src="https://jsdelivr.net"></script>
    
    <!-- Your Custom JS -->
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
