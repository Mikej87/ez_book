{% extends 'base.html' %}
{% load static %}
{% block body_class %}booking_form-page{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 500px;">
    <div class="card-body">
        <h3>{% if object %}Edit{% else %}New{% endif %} Booking</h3>
        <form method="post" class="mt-3">
            {% csrf_token %}
            {{ form.as_p }}
        </form>
        <form>
        <button type="submit" class="btn btn-primary w-100" style="color: black">Save Reservation</button>
        </form>
        <a href="{% url 'my_bookings' %}" class="d-block text-center mt-3 text-muted" style="color: whitesmoke; background-color: rgba(0, 0, 0, 0.5)">Cancel</a>
    </div>
</div>
{% endblock %}
